[project]
name = "macrodesk"
version = "0.1.0"
description = "LangGraph agent for economic analysis over the FRED API (JOLTS, GDP, yield curves)."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain>=1.0,<2",
    "langchain-anthropic>=1.7,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langsmith>=0.4",
    "fredapi>=0.5.2",
    "pandas>=2.2",
    "rich>=13",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "matplotlib>=3.11.2",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary]>=3.2",
]

[project.scripts]
macrodesk = "macrodesk.cli:main"

# LangGraph Studio's CLI is a developer tool, not an application dependency, and its server pulls in
# `cryptography`, which ships no wheel for Intel Macs in current releases. Run it on top of the project environment instead:
#   scripts/studio.sh        (uv run --with "langgraph-cli[inmem]" langgraph dev)
[dependency-groups]
dev = [
    "pytest>=8",
    "grandalf>=0.8",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macrodesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
